program: train-pcn.py
name: pc_emnist_lr
method: grid
parameters:
  data:
    value: emnist
  # use this format for nesting
  # cause otherwise hydra is confused
  # (see https://github.com/wandb/wandb/issues/4686#issuecomment-2407556397)
  training.learning_rate:
    values:
      - 0.0001
      - 0.00001
      - 0.000001
      - 0.0000001
      - 0.00000001
      - 0.000000001
  training.epochs:
    value: 100
  seed:
    values:
      - 0
      - 1
      - 2
      - 3
      - 4
command:
- ${env}
- PYTHONFAULTHANDLER=1
- XLA_PYTHON_CLIENT_PREALLOCATE=0
- uv
- run
- ${program}
# this is hydra interpolation not wandb
- hydra.run.dir=./outputs/pc_emnist_lr/lr_${training.learning_rate}_${seed}/${now:%Y-%m-%d}/${now:%H-%M-%S}
- ${args_no_hyphens}
