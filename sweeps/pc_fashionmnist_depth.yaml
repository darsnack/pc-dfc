program: train-pcn.py
name: pc_fashionmnist_depth
method: grid
parameters:
  data:
    value: fashionmnist
  model.activation_fn:
    value: tanh
  # use this format for nesting
  # cause otherwise hydra is confused
  # (see https://github.com/wandb/wandb/issues/4686#issuecomment-2407556397)
  training.learning_rate:
    value: 1e-5
  training.epochs:
    value: 100
  training.adam:
    value: true
  model.layer_dims:
    values:
      - [784, 256, 10]
      - [784, 256, 256, 10]
      - [784, 256, 256, 256, 10]
  seed:
    values:
      - 0
      - 1
      - 2
      - 3
      - 4
command:
- ${env}
- PYTHONFAULTHANDLER=1
- XLA_PYTHON_CLIENT_PREALLOCATE=0
- uv
- run
- ${program}
# this is hydra interpolation not wandb
- hydra.run.dir=./outputs/pc_fashionmnist_depth/depth_${model.layer_dims}_${seed}/${now:%Y-%m-%d}/${now:%H-%M-%S}
- ${args_no_hyphens}
