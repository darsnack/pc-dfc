program: train-pcn.py
name: pc_fashionmnist_time_constant
method: grid
parameters:
  data:
    value: fashionmnist
  model.activation_fn:
    value: tanh
  # use this format for nesting
  # cause otherwise hydra is confused
  # (see https://github.com/wandb/wandb/issues/4686#issuecomment-2407556397)
  training.learning_rate:
    values: 
      - 1e-8
      - 1e-5
  training.epochs:
    value: 100
  training.adam:
    value: true
  dynamics.convergence_tolerance:
    value: 1e-2
  dynamics.time_constant: 
    values:
      - 5
      - 10
      - 20
      - 30
      - 40
  seed:
    values:
      - 0
      - 1
      - 2
command:
- ${env}
- PYTHONFAULTHANDLER=1
- XLA_PYTHON_CLIENT_PREALLOCATE=0
- uv
- run
- ${program}
# this is hydra interpolation not wandb
- hydra.run.dir=./outputs/pc_fashionmnist_timeconstant/timeconstant_${dynamics.time_constant}_${seed}_lr${training.learning_rate}/${now:%Y-%m-%d}/${now:%H-%M-%S}
- ${args_no_hyphens}
