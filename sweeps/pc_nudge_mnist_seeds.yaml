program: train-pcn.py
name: pc_nudge_mnist_seeds
method: grid
parameters:
  data:
    value: mnist
  model.activation_fn:
    value: tanh
  nudge.enabled:
    value: true
  # use this format for nesting
  # cause otherwise hydra is confused
  # (see https://github.com/wandb/wandb/issues/4686#issuecomment-2407556397)
  training.learning_rate:
    value: 1e-6
  training.epochs:
    value: 50
  training.adam:
    value: true
  seed:
    values:
      - 0
      - 1
      - 2
      - 3
      - 4
command:
- ${env}
- PYTHONFAULTHANDLER=1
- XLA_PYTHON_CLIENT_PREALLOCATE=0
- uv
- run
- ${program}
# this is hydra interpolation not wandb
- hydra.run.dir=./outputs/pc_nudge_mnist_seeds/lr_${training.learning_rate}_${seed}/${now:%Y-%m-%d}/${now:%H-%M-%S}
- ${args_no_hyphens}
