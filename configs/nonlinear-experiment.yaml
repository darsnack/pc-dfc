seed: 10
model:
  input_dim: 1
  hidden_dims: [8, 8, 8, 8, 8]
  output_dim: 1
  kernel_init_scale: 1.0
dynamics:
  time_constant: 10.0
  free_min_timesteps: 10
  free_max_timesteps: 100000
  clamp_timesteps: 100000
  convergence_tolerance: 1e-8
approx_pc:
  k: 1.0
noise: 1.0
relinearize_steps_sweep: [null, 150, 100, 75, 50, 25, 10, 5, 1] # null = one linearization for full run
hydra:
  job:
    chdir: true
