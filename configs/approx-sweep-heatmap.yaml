defaults:
- _self_
- override hydra/hydra_logging: disabled
- override hydra/job_logging: disabled

experiment_dir: ???
row_axis: noise   # y-axis: rs, sf, noise, or layers
col_axis: sf  # x-axis: rs, sf, noise, or layers
# Fixed values for the two non-axis dimensions (ignored if that dim is an axis):
rs: null          # null or integer relinearize_steps
sf: 1.0           # scaling_factor
noise: 1.0        # noise magnitude
layers: 6         # total layer count; also selects network for scaling-factor line plots
lineplot_rs: null # relinearize_steps slice for scaling-factor line plots
convergence_tolerance: 1e-10
dpi: 300
hydra:
  output_subdir: null
  run:
    dir: .
