seed: 10
model:
  input_dim: 1
  hidden_dims: [8, 6, 4]   # used when layer_sweep is null
  hidden_size: 8            # uniform width for layer_sweep architectures
  output_dim: 1
  activation_fn: tanh   # identity, tanh, relu
  kernel_init_scale: 1.0
dynamics:
  time_constant: 10.0
  free_min_timesteps: 10
  free_max_timesteps: 2000
  clamp_timesteps: 5000
  convergence_tolerance: 1e-5
approx_pc:
  k: 1.0
  nudge:
    max_count: 100
    convergence_tolerance: 1e-3
experiment:
  noise_sweep: [0.1, 0.5, 1.0, 10.0, 50.0]
  layer_sweep: [2, 3, 4, 5, 6, 7, 8]  # null = single run with hidden_dims
  relinearize_steps_sweep: [null]      # null = one linearization per nudge
  scaling_factor_sweep: [1.0]
dpi: 150
hydra:
  job:
    chdir: true
