defaults:
- data: gaussian
- _self_
- optional task-overrides: ${data}

dynamics:
  time_constant: 30 # membrane time constant (units of dt)
  min_timesteps: 5
  max_timesteps: 5000
  convergence_tolerance: 1e-5
  tolerance_style: norm
  sync_updates: true
nudge:
  enabled: false
  max_count: 100
  convergence_tolerance: 1e-5
  scaling_factor: 0.1 # scale the nudge in the dir. of fixed pt.
model:
  layer_dims: [2, 2, 2, 1] # including input/output dims.
  activation_fn: noop # noop or tanh
  kernel_init_scale: 1.0
  use_bias: true
  conv: false
nmodels: 1
seed: 0
loss: mse
training:
  epochs: 50
  learning_rate: 1e-3
  adam: false
  batch_size: 1
profile: false
checkpointing:
  checkpoint_dir: ./checkpoints
  load_from: null # path to existing checkpoint to load, or null
