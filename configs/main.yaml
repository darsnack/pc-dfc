defaults:
- data: gaussian

time_constant: 30 # membrane time constant (units of dt)
nudge:
  max_count: 100
  convergence_tolerance: 1e-5
  scaling_factor: 0.1 # scale the nudge in the dir. of fixed pt.
model:
  layer_dims: [2, 2, 2, 1] # including input/output dims.
  activation_fn: noop # noop or tanh
seed: 0
training:
  epochs: 10
  learning_rate: 1e-3
  batch_size: 1
